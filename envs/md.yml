name: md
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - gromacs=2024.3  # 2025.1 quando disponível no bioconda
  - mdanalysis=2.7.0
  - mdtraj=1.10.0
  - numpy=1.26.4
  - pandas=2.2.0
  - matplotlib=3.8.4
  - seaborn=0.13.2
  - scipy=1.13.0
  - acpype=2023.10.27  # para gerar parâmetros GAFF2 de ligantes
